[project]
name = "ai-raider"
version = "0.5.0"
description = "Local Instagram and X research collector"
requires-python = ">=3.11"
dependencies = ["instaloader>=4.14,<5", "twscrape>=0.17,<1", "tzdata>=2025.1", "PyGithub>=2.8,<3", "yt-dlp[default]>=2026.1", "feedparser>=6,<7", "trafilatura>=2,<3", "beautifulsoup4>=4.12,<5", "huggingface-hub>=1,<3", "pydantic>=2.7,<3"]

[project.optional-dependencies]
processing = ["tesserocr>=2.9,<3", "Pillow>=11,<13", "faster-whisper>=1.2,<2", "av>=14,<18"]
browser = ["playwright>=1.50,<2"]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
ai-raider = "raider:main"
ai-raider-mcp = "raider_mcp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["raider", "source_manager", "media_store", "post_processing", "github_agent", "source_agents", "source_tools", "raider_mcp"]
packages = ["core", "agents"]
